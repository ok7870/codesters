<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Sender</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e4e4e4;
      --border-focus: #a0a0a0;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-muted: #a0a0a0;
      --accent: #1a1a1a;
      --accent-hover: #333;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #15803d;
      --error-bg: #fff1f2;
      --error-border: #fecdd3;
      --error-text: #be123c;
      --radius: 8px;
      --font: 'Georgia', serif;
      --font-mono: 'Courier New', monospace;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: normal;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    .tab {
      background: none;
      border: none;
      padding: 0.6rem 1.2rem;
      font-family: var(--font);
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
    }

    .tab:hover:not(.active) {
      color: var(--text-secondary);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Upload panel */
    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--border-focus);
      background: var(--surface);
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      opacity: 0.3;
    }

    .drop-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }

    .drop-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .file-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
    }

    .file-name { color: var(--text-primary); }
    .file-size { color: var(--text-muted); font-size: 0.75rem; }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      line-height: 1;
      transition: color 0.15s;
    }

    .remove-btn:hover { color: var(--error-text); }

    /* Write panel */
    .write-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--surface);
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--border-focus); }

    .char-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      margin-top: 0.4rem;
      font-style: italic;
    }

    /* Filename row */
    .filename-row {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .filename-row label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .filename-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-primary);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }

    .filename-row input:focus { border-color: var(--border-focus); }

    /* Server URL row */
    .url-row {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .url-row label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .url-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }

    .url-row input:focus { border-color: var(--border-focus); }

    /* Send button */
    .send-btn {
      margin-top: 1.5rem;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-family: var(--font);
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:active { transform: scale(0.99); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status */
    .status {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      display: none;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Text Sender</h1>
    <p class="subtitle">Upload a file or write text — send it to your Python server.</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('upload', this)">Upload file</button>
    <button class="tab" onclick="switchTab('write', this)">Write text</button>
    <button class="tab" id="tab-output" onclick="switchTab('output', this)">Output</button>
  </div>

  <!-- Upload panel -->
  <div id="panel-upload" class="panel active">
    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".txt,.md,.csv,.log,.json,.xml,.yaml,.yml" multiple />
      <div class="drop-icon">↑</div>
      <p class="drop-label">Drop files here, or click to browse</p>
      <p class="drop-hint">.txt, .md, .csv, .log, .json and other text files</p>
    </div>
    <div class="file-list" id="file-list"></div>
    <div class="url-row">
      <label for="upload-url">Server URL</label>
      <input type="text" id="upload-url" value="/upload" />
    </div>
    <button class="send-btn" id="upload-btn" onclick="sendFiles()">Send files →</button>
    <div class="status" id="upload-status"></div>
  </div>

  <!-- Write panel -->
  <div id="panel-write" class="panel">
    <label class="write-label" for="text-area">Your text</label>
    <textarea id="text-area" placeholder="Type or paste your text here…" oninput="updateCount()"></textarea>
    <div class="char-count"><span id="char-count">0</span> characters</div>
    <div class="filename-row">
      <label for="filename">Save as</label>
      <input type="text" id="filename" value="text.txt" placeholder="filename.txt" />
    </div>
    <div class="url-row">
      <label for="write-url">Server URL</label>
      <input type="text" id="write-url" value="/upload" />
    </div>
    <button class="send-btn" id="write-btn" onclick="sendText()">Send text →</button>
    <div class="status" id="write-status"></div>
  </div>

  <!-- Output panel -->
  <div id="panel-output" class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
      <span class="write-label" style="margin-bottom:0;">Python output</span>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <span id="poll-indicator" style="font-size:0.75rem; color:var(--text-muted); font-style:italic;">polling every 2s…</span>
        <button onclick="clearOutput()" style="background:none; border:1px solid var(--border); border-radius:var(--radius); padding:0.3rem 0.7rem; font-family:var(--font); font-size:0.78rem; color:var(--text-muted); cursor:pointer;">Clear</button>
      </div>
    </div>
    <pre id="output-box" style="
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-primary);
      min-height: 220px;
      max-height: 480px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    "><span style="color:var(--text-muted); font-style:italic;">Waiting for output from Python…</span></pre>
    <div style="margin-top:0.5rem; display:flex; align-items:center; justify-content:space-between;">
      <span id="output-timestamp" style="font-size:0.75rem; color:var(--text-muted); font-style:italic;"></span>
      <span id="output-len" style="font-size:0.75rem; color:var(--text-muted); font-style:italic;"></span>
    </div>
    <div class="url-row">
      <label for="output-url">Poll URL</label>
      <input type="text" id="output-url" value="/output" />
    </div>
  </div>
</div>

<script>
  let selectedFiles = [];

  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'output') clearBadge();
  }

  // Drag & drop
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    addFiles([...e.dataTransfer.files]);
  });

  fileInput.addEventListener('change', () => {
    addFiles([...fileInput.files]);
    fileInput.value = '';
  });

  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) {
        selectedFiles.push(f);
      }
    });
    renderFileList();
  }

  function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
  }

  function renderFileList() {
    const list = document.getElementById('file-list');
    list.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-item">
        <span class="file-name">${f.name}</span>
        <span class="file-size">${formatSize(f.size)}</span>
        <button class="remove-btn" onclick="removeFile(${i})" title="Remove">×</button>
      </div>
    `).join('');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function sendFiles() {
    if (selectedFiles.length === 0) return showStatus('upload-status', 'error', 'Please select at least one file.');
    const url = document.getElementById('upload-url').value.trim();
    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const fd = new FormData();
    selectedFiles.forEach(f => fd.append('files', f));
    try {
      const res = await fetch(url, { method: 'POST', body: fd });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        showStatus('upload-status', 'success', data.message || `${selectedFiles.length} file(s) sent successfully.`);
        selectedFiles = [];
        renderFileList();
      } else {
        showStatus('upload-status', 'error', data.error || `Server responded with ${res.status}.`);
      }
    } catch (e) {
      showStatus('upload-status', 'error', 'Could not reach the server. Is Flask running?');
    }
    btn.disabled = false;
    btn.textContent = 'Send files →';
  }

  async function sendText() {
    const text = document.getElementById('text-area').value.trim();
    const filename = document.getElementById('filename').value.trim() || 'text.txt';
    const url = document.getElementById('write-url').value.trim();
    if (!text) return showStatus('write-status', 'error', 'Please write some text first.');
    const btn = document.getElementById('write-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const blob = new Blob([text], { type: 'text/plain' });
    const fd = new FormData();
    fd.append('files', blob, filename);
    try {
      const res = await fetch(url, { method: 'POST', body: fd });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        showStatus('write-status', 'success', data.message || 'Text sent successfully.');
      } else {
        showStatus('write-status', 'error', data.error || `Server responded with ${res.status}.`);
      }
    } catch (e) {
      showStatus('write-status', 'error', 'Could not reach the server. Is Flask running?');
    }
    btn.disabled = false;
    btn.textContent = 'Send text →';
  }

  function updateCount() {
    document.getElementById('char-count').textContent =
      document.getElementById('text-area').value.length.toLocaleString();
  }

  function showStatus(id, type, msg) {
    const el = document.getElementById(id);
    el.className = 'status ' + type;
    el.textContent = msg;
    setTimeout(() => { el.className = 'status'; }, 6000);
  }

  // ── Output polling ──────────────────────────────────────────
  let lastOutput = null;

  function clearOutput() {
    lastOutput = null;
    document.getElementById('output-box').innerHTML =
      '<span style="color:var(--text-muted); font-style:italic;">Waiting for output from Python…</span>';
    document.getElementById('output-timestamp').textContent = '';
    document.getElementById('output-len').textContent = '';
  }

  function clearBadge() {
    const tab = document.getElementById('tab-output');
    tab.textContent = 'Output';
  }

  async function pollOutput() {
    const url = document.getElementById('output-url').value.trim();
    try {
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      const text = data.output ?? null;
      if (text === null || text === lastOutput) return;
      lastOutput = text;
      const box = document.getElementById('output-box');
      box.textContent = text;
      document.getElementById('output-timestamp').textContent =
        'Last updated: ' + new Date().toLocaleTimeString();
      document.getElementById('output-len').textContent =
        text.length.toLocaleString() + ' characters';
      // Badge on tab if not currently viewing output
      if (!document.getElementById('panel-output').classList.contains('active')) {
        document.getElementById('tab-output').textContent = 'Output ●';
      }
    } catch (_) {}
  }
  
  setInterval(pollOutput, 2000);
</script>
</body>
</html>
