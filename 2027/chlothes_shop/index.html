<!DOCTYPE html>
<html>
<head>
    <title>clothes shop</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="script.js"></script>
</head>
</html>

<body>
    <h1>the clothes shop</h1>
    <section>
        <div id="hats" class="selector">
            <button id="left_hats" onclick="change_hat_L()">left</button>
            <img id="image_hats" src="https://i.imgur.com/qCcovAh.png" alt="">
            <button id="right_hats" onclick="change_hat_R()">right</button>
        </div>
        <div id="shirts" class="selector">
            <button id="left_shirts" onclick="change_shirt_L()">left</button>
            <img id="image_shirts" src="https://i.imgur.com/eroo5Ca.png" alt="">
            <button id="right_shirts" onclick="change_shirt_R()">right</button>
        </div>
        <div id="pants" class="selector">
            <button id="left_pants" onclick="change_pants_L()">left</button>
            <img id="image_pants" src="https://i.imgur.com/TqKPjuX.png" alt="">
            <button id="right_pants" onclick="change_pants_R()">right</button>
        </div>
    </section>
    <button class="randomize" onclick="randomize()">randomize</button>
</body>
