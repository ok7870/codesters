<body>

        <div id="shirts" class="selector">
            <button id="left_shirts">left</button>

        <div id="pants" class="selector">
            <button id="left_pants">left</button>
            <img id="image_pants" src="" alt="">
            <button id="right_pants">right</button>
        </div>
    </section>
