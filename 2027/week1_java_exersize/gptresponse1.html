<!DOCTYPE html>
<html>
<head>
    <title>JS Button Example</title>
</head>
<body>

    <button onclick="sayHello()">Click me</button>

    <p id="result"></p>

    <script>
        function sayHello() {
            const message = "Hello from JavaScript!";
            document.getElementById("result").textContent = message;
        }
    </script>

</body>
</html>
