
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Vue App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 40px 16px;
      margin: 0;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }

    h1 { color: #42b883; }

    .form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #42b883;
      color: white;
    }

    ul { padding: 0; list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    li span { flex: 1; overflow-wrap: anywhere; }

    li.done span {
      text-decoration: line-through;
      color: #888;
    }

    button.delete { background: #e05252; }
    .summary { color: #666; }
  </style>
</head>

<body>
  <div id="app" class="app">
    <h1>My Vue Task Manager</h1>
    <p>Learn Vue by managing your tasks!</p>

    <form class="form" @submit.prevent="addTask">
      <input
        v-model="newTask"
        placeholder="What do you need to do?"
      >
      <button type="submit">Add</button>
    </form>

    <p class="summary">
      Total: {{ tasks.length }} |
      Completed: {{ completedCount }}
    </p>

    <ul>
      <li
        v-for="task in tasks"
        :key="task.id"
        :class="{ done: task.completed }"
      >
        <input
          type="checkbox"
          v-model="task.completed"
          aria-label="Mark task complete"
        >

        <span>{{ task.text }}</span>

        <button
          class="delete"
          @click="removeTask(task.id)"
        >
          Delete
        </button>
      </li>
    </ul>

    <p v-if="tasks.length === 0">
      No tasks yet. Add your first task above!
    </p>
  </div>

  <!-- Load Vue from the internet -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const newTask = ref("");
        const tasks = ref([
          { id: 1, text: "Learn HTML", completed: true },
          { id: 2, text: "Learn Vue.js", completed: false }
        ]);

        const completedCount = computed(() =>
          tasks.value.filter(task => task.completed).length
        );

        function addTask() {
          const text = newTask.value.trim();

          if (!text) return;

          tasks.value.push({
            id: Date.now(),
            text,
            completed: false
          });

          newTask.value = "";
        }

        function removeTask(id) {
          tasks.value = tasks.value.filter(
            task => task.id !== id
          );
        }

        return {
          newTask,
          tasks,
          completedCount,
          addTask,
          removeTask
        };
      }
    }).mount("#app");
  </script>
</body>
</html>
